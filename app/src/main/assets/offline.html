<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Offline</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f0f0f0; text-align: center; }
        h1 { color: #333; }
        p { color: #666; }
        button { padding: 10px 20px; font-size: 16px; color: white; background-color: #007bff; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Sem Ligaçāo à Internet</h1>
    <p>Por favor, verifique a sua ligaçāo e tente novamente.</p>
    <br/>
    <h1>No Internet Connection</h1>
    <p>Please check your connection and try again.</p>
    <br/>
    <button onclick="Android.retryConnection()">Tentar Novamente / Try Again</button>
</body>
</html>
